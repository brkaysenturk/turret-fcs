name: Turret FCS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]" --extra-index-url https://download.pytorch.org/whl/cpu

    - name: Lint (ruff)
      run: |
        python -m ruff check turret_fcs tests analysis webots

    - name: Run Test Suite
      env:
        PYTHONPATH: .
        CUDA_VISIBLE_DEVICES: ""
        MPLBACKEND: Agg
      run: |
        python -m pytest tests/ -v

  windows-setup:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      shell: cmd
      env:
        CI: "true"
        MPLBACKEND: Agg
      run: |
        python -m venv venv
        venv\Scripts\python.exe -m pip install --upgrade pip
        venv\Scripts\python.exe -m pip install -e ".[test]" --extra-index-url https://download.pytorch.org/whl/cpu

    - name: Lint (ruff)
      shell: cmd
      run: venv\Scripts\python.exe -m ruff check turret_fcs tests analysis webots

    - name: Verify package imports
      shell: cmd
      run: venv\Scripts\python.exe -c "import turret_fcs; from turret_fcs.main import main; print('package imports OK')"

    - name: Run Test Suite
      shell: cmd
      env:
        PYTHONPATH: .
        CUDA_VISIBLE_DEVICES: ""
        MPLBACKEND: Agg
      run: venv\Scripts\python.exe -m pytest tests/ -q
